## Settings file for Boss Affix By Players (cjayride.bossgroupaffix)
## Install on the server and every client. Copy into your profile's BepInEx/config/ if the game does not create it.

[General]

## Pick the boss affix from how many players are near the boss before the fight starts.
Enabled = true

## CL&LC affix when one living player is in PlayerRange. None, Reflective, Shielded, Mending, Summoner, Elementalist, Enraged, Sturdy.
SoloAffix = Reflective

## CL&LC affix when two or more living players are in range.
GroupAffix = Summoner

## Meters from the boss. Players this close count toward solo or group.
PlayerRange = 180
